<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>{{MODEL}} – Cairo Sales</title>
<style>
  @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo.ttf"); font-weight: 200 1000; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf"); font-weight: 100 900; }

  :root {
    --red: #D71F2B;
    --red-deep: #9E0F19;
    --ink: #16181D;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --w: 105mm;
    --h: 148mm;
  }
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: var(--paper); }
  body {
    font-family: "Cairo", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    overflow: hidden;
  }

  .card { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }

  /* ---------- red hero ---------- */
  .hero {
    position: absolute; inset: 0 0 auto 0; height: 76mm;
    background:
      radial-gradient(120% 90% at 85% 0%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(80% 70% at 0% 100%, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 60%),
      linear-gradient(160deg, #EC2A36 0%, var(--red) 45%, var(--red-deep) 100%);
    clip-path: ellipse(135% 100% at 50% 0%);
  }
  /* soft diagonal light streaks */
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.055) 0 2mm, rgba(255,255,255,0) 2mm 7mm);
    mask-image: linear-gradient(180deg, #000 0%, transparent 85%);
  }
  /* big ghost rings */
  .ring { position: absolute; border-radius: 50%; border: 1.2mm solid rgba(255,255,255,.08); }
  .ring.a { width: 70mm; height: 70mm; left: -30mm; top: -26mm; }
  .ring.b { width: 44mm; height: 44mm; right: -14mm; top: 30mm; border-width: .8mm; }

  .top {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6mm 6.5mm 0;
  }
  .logo {
    width: 21mm; height: 21mm; border-radius: 50%;
    background: #fff; padding: .6mm;
    box-shadow: 0 1.6mm 4mm rgba(60,0,5,.35), 0 0 0 .8mm rgba(255,255,255,.35);
  }
  .logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; transform: scale(1.1); }
  .brand-chip {
    display: flex; flex-direction: column; align-items: flex-start; gap: .4mm;
    direction: ltr;
  }
  .brand-chip .brand {
    font-family: "Inter"; font-weight: 900; font-size: 7.4mm; letter-spacing: -.2mm; color: #fff; line-height: 1;
  }
  .brand-chip .cat {
    font-family: "Cairo"; font-weight: 600; font-size: 3mm; color: rgba(255,255,255,.85);
    direction: rtl; line-height: 1.2;
  }

  .title {
    position: relative; z-index: 2; text-align: center; color: #fff;
    padding: 3.2mm 6mm 0;
  }
  .title h1 {
    font-weight: 800; font-size: 7.6mm; line-height: 1.15;
    text-shadow: 0 .5mm 1.5mm rgba(80,0,0,.25);
  }
  .specs { display: flex; justify-content: center; gap: 1.8mm; margin-top: 2.6mm; flex-wrap: wrap; }
  .spec {
    display: flex; align-items: baseline; gap: 1mm;
    background: rgba(255,255,255,.14); border: .25mm solid rgba(255,255,255,.35);
    border-radius: 10mm; padding: .5mm 3mm .7mm;
    font-weight: 700; font-size: 3.5mm; color: #fff; white-space: nowrap;
    backdrop-filter: blur(2px);
  }
  .spec b { font-family: "Inter"; font-weight: 800; font-size: 3.7mm; }

  /* ---------- QR card ---------- */
  .qr-wrap {
    position: absolute; left: 50%; top: 51.5mm; transform: translateX(-50%);
    width: 54mm; z-index: 3;
  }
  .qr-card {
    position: relative; background: #fff; border-radius: 6mm; padding: 4.8mm;
    box-shadow: 0 3mm 8mm rgba(20,0,0,.18), 0 .6mm 1.6mm rgba(20,0,0,.12);
  }
  .qr-card svg.qr { display: block; width: 100%; height: auto; }
  /* red corner brackets */
  .corner { position: absolute; width: 8mm; height: 8mm; border: 1.1mm solid var(--red); }
  .corner.tl { top: 1.6mm; left: 1.6mm; border-right: 0; border-bottom: 0; border-top-left-radius: 4.2mm; }
  .corner.tr { top: 1.6mm; right: 1.6mm; border-left: 0; border-bottom: 0; border-top-right-radius: 4.2mm; }
  .corner.bl { bottom: 1.6mm; left: 1.6mm; border-right: 0; border-top: 0; border-bottom-left-radius: 4.2mm; }
  .corner.br { bottom: 1.6mm; right: 1.6mm; border-left: 0; border-top: 0; border-bottom-right-radius: 4.2mm; }
  .qr-logo {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 22%; aspect-ratio: 1; border-radius: 50%; background: #fff; padding: .7mm;
    box-shadow: 0 0 0 .9mm #fff, 0 .6mm 1.6mm rgba(0,0,0,.2);
  }
  .qr-logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; transform: scale(1.1); }

  .scan-tag {
    position: absolute; left: 50%; bottom: -3.6mm; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1.6mm;
    background: var(--ink); color: #fff; border-radius: 10mm;
    padding: .9mm 3.6mm 1.1mm; white-space: nowrap;
    font-weight: 700; font-size: 3.3mm;
    box-shadow: 0 1mm 2.5mm rgba(0,0,0,.25);
  }
  .scan-tag svg { width: 3.8mm; height: 3.8mm; }

  /* ---------- model line ---------- */
  .info {
    position: absolute; left: 0; right: 0; top: 111mm;
    display: flex; align-items: baseline; justify-content: center; gap: 2mm; direction: ltr;
  }
  .model { font-family: "Inter"; font-weight: 800; font-size: 5mm; letter-spacing: .3mm; line-height: 1.1; }
  .model-label { font-family: "Inter"; font-weight: 700; font-size: 2.2mm; letter-spacing: .7mm; color: var(--red); }

  /* ---------- website QR row ---------- */
  .web {
    position: absolute; left: 7mm; right: 7mm; top: 118.5mm; height: 18mm;
    display: flex; align-items: center; justify-content: space-between; gap: 3mm;
    padding: 0 0 0 0;
  }
  .web-text { display: flex; flex-direction: column; align-items: flex-start; gap: .2mm; }
  .web-q { font-weight: 800; font-size: 3.9mm; line-height: 1.25; color: var(--ink); }
  .web-a {
    display: flex; align-items: center; gap: 1.4mm;
    font-weight: 800; font-size: 3.9mm; line-height: 1.25; color: var(--red);
  }
  .web-a svg { width: 6mm; height: 3mm; }
  .web-url {
    display: flex; align-items: center; gap: 1mm; margin-top: .8mm;
    font-family: "Inter"; font-weight: 700; font-size: 2.3mm; letter-spacing: .45mm; color: var(--muted); direction: ltr;
  }
  .web-url svg { width: 2.8mm; height: 2.8mm; }
  .web-qr {
    flex-shrink: 0; width: 18mm; height: 18mm; padding: 1.2mm;
    background: #fff; border: .45mm solid var(--red); border-radius: 2.6mm;
    box-shadow: 0 .8mm 2mm rgba(20,0,0,.12);
  }
  .web-qr svg { display: block; width: 100%; height: 100%; }

  /* ---------- footer ---------- */
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 10mm;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 2.2mm;
  }
  .footer::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: .7mm;
    background: linear-gradient(90deg, var(--red-deep), var(--red), #F04450, var(--red), var(--red-deep));
  }
  .footer .lbl { font-weight: 600; font-size: 3mm; color: rgba(255,255,255,.8); }
  .hotline {
    display: flex; align-items: center; gap: 1.2mm;
    background: var(--red); border-radius: 1.8mm; padding: .5mm 2.2mm .7mm;
  }
  .hotline svg { width: 3mm; height: 3mm; }
  .hotline b { font-family: "Inter"; font-weight: 900; font-size: 4mm; letter-spacing: .2mm; line-height: 1; }
</style>
</head>
<body>
<div class="card">

  <div class="hero">
    <div class="ring a"></div>
    <div class="ring b"></div>

    <div class="top">
      <div class="logo"><img src="assets/logo.jpeg" alt="Cairo Sales Stores"></div>
      <div class="brand-chip">
        <div class="brand">{{BRAND}}</div>
        <div class="cat">{{CATEGORY}}</div>
      </div>
    </div>

    <div class="title">
      <h1>{{TITLE}}</h1>
      <div class="specs">{{SPECS}}</div>
    </div>
  </div>

  <div class="qr-wrap">
    <div class="qr-card">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      {{QR_SVG}}
      <div class="qr-logo"><img src="assets/logo.jpeg" alt=""></div>
      <div class="scan-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"/>
        </svg>
        امسح الكود وشوف السعر والمواصفات
      </div>
    </div>
  </div>

  <div class="info">
    <span class="model-label">MODEL</span>
    <span class="model">{{MODEL}}</span>
  </div>

  <div class="web">
    <div class="web-text">
      <div class="web-q">عايز تشوف المنتج ده على موقعنا؟</div>
      <div class="web-a">
        امسح الكود ده
        <svg viewBox="0 0 24 12" fill="none" stroke="#D71F2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6H2M7 1 2 6l5 5"/></svg>
      </div>
      <div class="web-url">
        <svg viewBox="0 0 24 24" fill="none" stroke="#D71F2B" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg>
        CAIROSALES.COM
      </div>
    </div>
    <div class="web-qr">{{WEB_QR_SVG}}</div>
  </div>

  <div class="footer">
    <span class="lbl">{{STORE}}</span>
    <div class="hotline">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      <b>{{HOTLINE}}</b>
    </div>
  </div>

</div>
</body>
</html>
